<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CRM Harpy">
  <title>CRM Harpy</title>
  <defs>
    <!-- mesmo ceu da marca, mas preenchendo o quadrado inteiro (sem cantos
         arredondados): quem recorta a forma e o sistema operacional -->
    <linearGradient id="ceuHarpyM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset=".45" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#E11D3C"/>
    </linearGradient>
    <radialGradient id="brilhoHarpyM" cx=".26" cy=".14" r=".9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#ceuHarpyM)"/>
  <rect width="512" height="512" fill="url(#brilhoHarpyM)"/>

  <!-- aguia menor: cabe na zona segura de 80% (circulo de raio 204.8 no centro).
       Escala 6.4 -> 281 x 198 px, meia-diagonal ~172 px, folga confortavel. -->
  <g transform="translate(99.2 74.6) scale(6.4)" fill="#FFFFFF">
    <path d="M2.5 30.5c3.6-8.8 10.7-15 20.2-17.6-5.6 3.2-9.7 7.4-12.2 12.6 3.7-2.2 7.4-3.3 11.2-3.3-5.3 3-9.1 6.8-11.4 11.6 3.5-2 7-3 10.5-3-5.6 3.6-9.4 7.9-11.5 13-3.5-4.2-5.3-8.6-6.8-13.3z"/>
    <path d="M22 17.8c5.9-3.4 12.4-2.7 17 1.9l7.5-1.4-6 5.1c.7 4.9-1.4 9.4-5.9 12.2-5 3.1-11 2.6-15.2-.9 2.6-.8 4.8-2 6.6-3.7-4.4-3.3-6.1-8.3-4-13.2z"/>
  </g>
</svg>
